name: Resume UI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check field ordering, URLs and DOM initialization
        run: node --test tests/*.test.cjs
      - name: Check production syntax
        run: node --check project-view.js && node --check index.js
      - name: Verify release asset hashes and cache isolation
        run: |
          python3 scripts/build_assets.py --check
          python3 -m unittest discover -s tests -p test_assets.py
